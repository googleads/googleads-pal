apply plugin: "com.android.application"

android {
    namespace = "com.example.palsampleapp"
    compileSdk = 36

    // Java 11 required by Gradle 7.0.2
    compileOptions {
        // PAL requires app desugaring as of version 23.0.0.
        // [START app_desugaring]
        coreLibraryDesugaringEnabled = true
        // [END app_desugaring]

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.palsampleapp"
        minSdkVersion(23)
        targetSdkVersion(36)
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.3.0"))
    implementation("androidx.appcompat:appcompat:1.7.1")
    // [START pal_sdk_version]
    implementation("com.google.android.gms:play-services-pal:23.1.0")
    // [END pal_sdk_version]
}
